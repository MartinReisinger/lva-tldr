name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lva-tldr-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/martinreisinger/lva-tldr:latest
            ghcr.io/martinreisinger/lva-tldr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
        env:
          BUILDKIT_PROGRESS: plain

      - name: Deploy on VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -eu
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key deploy/vps/compose.yml \
            "deploy@$SSH_HOST:/home/deploy/lva-tldr/compose.pending.yml"
          ssh -i ~/.ssh/deploy_key "deploy@$SSH_HOST" 'sh -s' < deploy/vps/deploy.sh
