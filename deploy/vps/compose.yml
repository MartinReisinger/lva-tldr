services:
  lva-tldr:
    image: ghcr.io/martinreisinger/lva-tldr:latest
    container_name: lva-tldr
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Vienna
      NUXT_QUIZ_DATABASE_PATH: /app/.data/quiz-progress.sqlite
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      NUXT_OAUTH_GOOGLE_REDIRECT_URL: ${NUXT_OAUTH_GOOGLE_REDIRECT_URL:-}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
    ports:
      - "127.0.0.1:3009:3000"
    volumes:
      - quiz-data:/app/.data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/')
          .then(r => process.exit(r.status < 400 ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  quiz-data:
