name: Deploy to Coolify

# Enable push to main only after an approved and tested cutover.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: vps-runner
    container:
      image: local/runner-env
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          test -n "$COOLIFY_WEBHOOK" || { echo "Missing COOLIFY_WEBHOOK" >&2; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo "Missing COOLIFY_TOKEN" >&2; exit 1; }
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
